<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>张行 Zhang Hang · 个人主页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="张行（Zhang Hang），中国移动咪咕 AI 团队负责人 / AI 算法总监，原华为盘古大模型团队高级算法工程师，中国科学院大学硕士。专注大模型后训练、文生图、多模态与 AI Agent 的研究落地。">
  <meta name="author" content="Zhang Hang">
  <meta name="theme-color" content="#1554a3">
  <meta property="og:type" content="website">
  <meta property="og:title" content="张行 Zhang Hang · 个人主页">
  <meta property="og:url" content="https://zhanghang1995.github.io/">
  <meta property="og:site_name" content="张行 Zhang Hang">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:description" content="工程 × 学术：大模型后训练、文生图、多模态、AI Agent。论文 12 篇（含 Scientific Data、IEEE RA-L、Neurocomputing 等），英文专著 1 部。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%231554a3'/%3E%3Ctext%20x='32'%20y='45'%20font-size='34'%20font-family='Georgia,Songti%20SC,serif'%20fill='%23ffffff'%20text-anchor='middle'%3E%E8%A1%8C%3C/text%3E%3C/svg%3E">
  <!--
    ─────────────────────────────────────────────────────────
    本页面为骨架文件：内容与样式分离，日常更新无需改动本文件。
      · 内容更新 → 编辑 site-data.js（简介/项目/论文/荣誉/报道）
      · 论文链接 → 编辑 papers.js
      · 渲染逻辑 → render.js
    ─────────────────────────────────────────────────────────
  -->
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --ink: #1c2b3a;
      --muted: #5b6b7b;
      --faint: #8a97a5;
      --accent: #1554a3;
      --accent-dark: #0e3d77;
      --accent-light: #eaf1fa;
      --gold: #a16207;
      --gold-light: #fdf6e3;
      --line: #e3e8ee;
      --hover-bg: #f0f6fd;
      --hover-border: #c9daf0;
      --serif: Georgia, "Times New Roman", "Songti SC", "Noto Serif SC", "SimSun", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: "SF Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      overflow-wrap: break-word;
    }

    ::selection { background: #cfe0f5; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-dark); text-decoration: underline; }

    .container { max-width: 1020px; margin: 0 auto; padding: 0 24px; }

    /* ---------- 顶部导航 ---------- */
    nav.topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      gap: 16px;
    }
    .brand {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 18px;
      color: var(--ink);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .brand em { font-style: italic; font-weight: 400; color: var(--faint); font-size: 14px; margin-left: 6px; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a {
      color: var(--muted);
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .nav-links a:hover { color: var(--accent-dark); background: var(--accent-light); text-decoration: none; }
    .nav-scholar {
      margin-left: 8px;
      font-size: 13px;
      color: var(--accent-dark);
      border: 1px solid #c5d6ee;
      background: var(--accent-light);
      padding: 5px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .nav-scholar:hover { background: #dce9f8; text-decoration: none; }

    /* ---------- Hero ---------- */
    header.hero {
      position: relative;
      overflow: hidden;
      border-top: 4px solid var(--accent);
      background:
        radial-gradient(900px 320px at 85% -10%, rgba(21, 84, 163, 0.08), transparent 65%),
        radial-gradient(600px 260px at 8% 0%, rgba(21, 84, 163, 0.05), transparent 60%),
        linear-gradient(180deg, #ffffff 0%, #f4f7fb 100%);
    }
    .hero-inner { padding: 72px 0 52px; }
    .hero-grid { display: flex; gap: 36px; align-items: flex-start; }
    .avatar {
      flex: 0 0 auto;
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1554a3 0%, #3f7cc4 100%);
      color: #fff;
      font-family: var(--serif);
      font-size: 46px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 24px rgba(21, 84, 163, 0.25), inset 0 0 0 4px rgba(255, 255, 255, 0.65);
    }
    .hero-main { flex: 1 1 auto; min-width: 0; }
    h1.name {
      font-family: var(--serif);
      font-size: 38px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 1px;
    }
    h1.name .en {
      font-size: 19px;
      font-style: italic;
      font-weight: 400;
      color: var(--faint);
      margin-left: 10px;
      letter-spacing: 0.5px;
    }
    .nickname {
      display: inline-block;
      vertical-align: middle;
      margin-left: 12px;
      transform: translateY(-4px);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--accent-dark);
      background: var(--accent-light);
      border: 1px solid #c9d8ec;
      border-radius: 999px;
      padding: 3px 12px;
    }
    .role { margin-top: 8px; font-size: 15.5px; color: var(--ink); }
    .role strong { color: var(--accent-dark); font-weight: 600; }
    .role .sep, .meta .sep { color: #c3ccd6; margin: 0 8px; }
    .meta { margin-top: 4px; font-size: 14px; color: var(--muted); }
    .bio {
      margin-top: 18px;
      max-width: 760px;
      color: #33465a;
      font-size: 15.5px;
      line-height: 1.95;
      text-align: justify;
    }
    .motto {
      margin-top: 14px;
      font-family: var(--serif);
      font-style: italic;
      color: var(--accent-dark);
      font-size: 15px;
    }
    .motto::before { content: "「"; color: var(--faint); }
    .motto::after { content: "」"; color: var(--faint); }

    .actions { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid transparent;
      transition: all 0.18s ease;
    }
    .btn:hover { text-decoration: none; transform: translateY(-1px); }
    .btn-solid { background: var(--accent); color: #fff; box-shadow: 0 3px 12px rgba(21, 84, 163, 0.28); }
    .btn-solid:hover { background: var(--accent-dark); color: #fff; }
    .btn-outline { background: #fff; color: var(--accent-dark); border-color: #c9d8ec; }
    .btn-outline:hover { border-color: var(--accent); background: var(--accent-light); }

    .stats {
      margin-top: 36px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .stat { background: rgba(255, 255, 255, 0.85); padding: 18px 20px 16px; }
    .stat .num {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
    }
    .stat .num small { font-size: 15px; font-weight: 600; margin-left: 2px; }
    .stat .lab { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* ---------- 章节通用 ---------- */
    main { padding: 20px 0 72px; }
    section { margin-top: 64px; scroll-margin-top: 76px; }
    .sec-head { margin-bottom: 26px; }
    .sec-label {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
    }
    .sec-head h2 {
      font-family: var(--serif);
      font-size: 27px;
      font-weight: 700;
      margin-top: 4px;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    .sec-head h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--line), transparent);
      transform: translateY(-5px);
    }
    .sec-head .en-title { font-size: 14px; font-style: italic; font-weight: 400; color: var(--faint); }

    /* ---------- 研究方向 ---------- */
    .interest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr));
      gap: 18px;
    }
    .interest {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 22px 24px;
      transition: box-shadow 0.2s ease, transform 0.2s ease,
                  background-color 0.25s ease, border-color 0.25s ease;
    }
    .interest:hover {
      background: var(--hover-bg);
      border-color: var(--hover-border);
      box-shadow: 0 8px 26px rgba(21, 84, 163, 0.12);
      transform: translateY(-2px);
    }
    .interest:hover h3 { color: var(--accent-dark); }
    .interest:hover p { color: #33465a; }
    .interest h3 {
      font-family: var(--serif);
      font-size: 17.5px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .interest h3 .ico {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--accent-light);
      color: var(--accent-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
    .interest p { margin-top: 10px; font-size: 14px; color: var(--muted); line-height: 1.85; }
    .chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: var(--accent-light);
      color: var(--accent-dark);
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 12.5px;
      white-space: nowrap;
    }

    /* ---------- 工程实践 ---------- */
    .proj-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 18px;
    }
    .proj {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s ease, transform 0.2s ease,
                  background-color 0.25s ease, border-color 0.25s ease;
    }
    .proj:hover {
      background: var(--hover-bg);
      border-color: var(--hover-border);
      box-shadow: 0 8px 26px rgba(21, 84, 163, 0.12);
      transform: translateY(-2px);
    }
    .proj:hover h3 { color: var(--accent-dark); }
    .proj:hover li { color: #33465a; }
    .proj-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tag {
      font-size: 12px;
      color: var(--accent-dark);
      background: var(--accent-light);
      border-radius: 999px;
      padding: 2px 10px;
      white-space: nowrap;
    }
    .tag.gold { color: var(--gold); background: var(--gold-light); }
    .proj h3 { font-family: var(--serif); font-size: 17px; margin-top: 10px; line-height: 1.5; }
    .proj ul { margin: 10px 0 0 18px; }
    .proj li { font-size: 13.8px; color: #44566b; margin-top: 6px; line-height: 1.8; }
    .proj li::marker { color: var(--accent); }
    .impact {
      padding-top: 14px;
      margin-top: 16px;
      border-top: 1px dashed var(--line);
      font-size: 13.5px;
      color: var(--muted);
    }
    .impact::before { content: "✦ "; color: var(--accent); }
    .impact strong { color: var(--accent-dark); font-weight: 700; }

    /* ---------- 学术成果 ---------- */
    .pub-list { list-style: none; display: grid; gap: 12px; }
    .pub {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 16px 20px;
      transition: box-shadow 0.2s ease, background-color 0.25s ease, border-color 0.25s ease;
    }
    .pub:hover {
      background: var(--hover-bg);
      border-color: var(--hover-border);
      border-left-color: var(--accent);
      box-shadow: 0 6px 20px rgba(21, 84, 163, 0.10);
    }
    .pub:hover .pub-title { color: var(--accent-dark); }
    .pub:hover .pub-authors { color: #4a5a6b; }
    .pub-title { font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.6; }
    .pub-authors { margin-top: 4px; font-size: 13px; color: var(--muted); font-style: italic; }
    .pub-authors .me { color: var(--accent-dark); font-weight: 600; font-style: normal; }
    .pub-meta { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 12px;
      border-radius: 999px;
      padding: 2px 10px;
      background: #eef1f5;
      color: #4a5a6b;
      white-space: nowrap;
    }
    .badge.venue { background: var(--accent-light); color: var(--accent-dark); font-weight: 600; }
    .badge.first { background: var(--gold-light); color: var(--gold); font-weight: 600; }
    .pub-year { font-family: var(--mono); font-size: 12.5px; color: var(--faint); margin-left: auto; }
    .pub-note { margin-top: 6px; font-size: 12.5px; color: var(--faint); }

    .pub-group { margin-top: 34px; }
    .pub-group-title {
      font-family: var(--serif);
      font-size: 16.5px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .pub-group-title .count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      background: var(--accent-light);
      border-radius: 999px;
      padding: 1px 10px;
    }
    .pub-title a { color: var(--ink); border-bottom: 1px solid #b9cde8; transition: color 0.15s ease; }
    .pub-title a:hover { color: var(--accent-dark); border-bottom-color: var(--accent-dark); text-decoration: none; }
    .pub-title .link-mark { color: var(--accent); font-size: 13px; margin-left: 3px; }
    .pub-cite { font-family: var(--mono); font-size: 12.5px; color: var(--gold); white-space: nowrap; }
    .pub-cite::before { content: "被引 "; font-family: var(--sans); color: var(--faint); }
    .scholar-stats { display: flex; gap: 34px; }
    .scholar-stats > div { text-align: center; }
    .scholar-stats b { display: block; font-family: var(--serif); font-size: 26px; color: var(--accent); line-height: 1.2; }
    .scholar-stats span { font-size: 12.5px; color: var(--muted); }
    @media (max-width: 720px) { .scholar-stats { gap: 20px; } }

    .scholar-banner {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      background: linear-gradient(120deg, #f3f7fc 0%, #eaf1fa 100%);
      border: 1px solid #d5e2f2;
      border-radius: 12px;
      padding: 18px 24px;
    }
    .scholar-banner .txt { flex: 1 1 260px; }
    .scholar-banner .txt b { font-family: var(--serif); font-size: 16px; }
    .scholar-banner .txt p { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
    .research-note {
      margin-top: 22px;
      font-size: 13.8px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 20px;
    }
    .research-note b { color: var(--ink); }

    /* ---------- 履历时间线 ---------- */
    .timeline { list-style: none; position: relative; padding-left: 26px; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: linear-gradient(180deg, var(--accent) 0%, #c9d8ec 100%);
    }
    .tl-item { position: relative; padding: 0 0 30px 22px; }
    .tl-item:last-child { padding-bottom: 4px; }
    .tl-item::before {
      content: "";
      position: absolute;
      left: -26px;
      top: 7px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 4px rgba(21, 84, 163, 0.12);
    }
    .tl-date { font-family: var(--mono); font-size: 12.5px; color: var(--accent); letter-spacing: 0.3px; }
    .tl-head {
      margin-top: 2px;
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .tl-head .org { color: var(--ink); }
    .tl-head .role-title { font-size: 14px; font-weight: 400; color: var(--muted); }
    .tl-desc { margin-top: 4px; font-size: 14px; color: var(--muted); max-width: 780px; }

    /* ---------- 荣誉奖项 ---------- */
    .honor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 18px; }
    .honor {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 22px 24px;
      transition: box-shadow 0.2s ease, transform 0.2s ease,
                  background-color 0.25s ease, border-color 0.25s ease;
    }
    .honor:hover {
      background: var(--hover-bg);
      border-color: var(--hover-border);
      box-shadow: 0 8px 26px rgba(21, 84, 163, 0.12);
      transform: translateY(-2px);
    }
    .honor:hover h3 { color: var(--accent-dark); }
    .honor:hover li { color: #33465a; }
    .honor h3 { font-family: var(--serif); font-size: 16.5px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .honor ul { list-style: none; margin-top: 6px; }
    .honor li {
      position: relative;
      padding: 9px 0 9px 24px;
      font-size: 14px;
      color: #44566b;
      border-bottom: 1px dashed #edf1f5;
    }
    .honor li:last-child { border-bottom: none; }
    .honor li::before { content: "✦"; position: absolute; left: 2px; color: var(--gold); font-size: 13px; top: 11px; }
    .honor li strong { color: var(--ink); }

    /* ---------- 媒体报道 ---------- */
    .media-list { display: grid; gap: 14px; }
    .media-card {
      display: flex;
      gap: 22px;
      align-items: flex-start;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px 24px;
      color: inherit;
      transition: box-shadow 0.2s ease, transform 0.2s ease,
                  background-color 0.25s ease, border-color 0.25s ease;
    }
    .media-card:hover {
      background: var(--hover-bg);
      border-color: var(--hover-border);
      box-shadow: 0 8px 26px rgba(21, 84, 163, 0.12);
      transform: translateY(-2px);
      text-decoration: none;
    }
    .media-card:hover .src-name { color: var(--accent-dark); }
    .media-card:hover .media-body p { color: #33465a; }
    .media-src {
      flex: 0 0 150px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 2px;
    }
    .src-badge {
      align-self: flex-start;
      font-size: 12px;
      color: var(--gold);
      background: var(--gold-light);
      border-radius: 999px;
      padding: 2px 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .src-name { font-family: var(--serif); font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.45; }
    .src-date { font-family: var(--mono); font-size: 12px; color: var(--faint); }
    .media-body { flex: 1; min-width: 0; }
    .media-body h3 { font-family: var(--serif); font-size: 16.5px; line-height: 1.55; color: var(--accent-dark); }
    .media-card:hover .media-body h3 { color: var(--accent); }
    .media-body p { margin-top: 6px; font-size: 13.8px; color: #44566b; line-height: 1.85; }

    /* ---------- 页脚 ---------- */
    footer {
      border-top: 1px solid var(--line);
      background: #fbfcfe;
      padding: 30px 0 36px;
      font-size: 13.5px;
      color: var(--muted);
    }
